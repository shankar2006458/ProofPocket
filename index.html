  function loadSampleData() {
    const fresh = buildSampleProducts();
    state.products = state.products.concat(fresh);
    if (saveProducts()) {
      toast(fresh.length + ' sample products added.', 'success');
    }
    renderView();
  }

  function removeSampleData() {
    const count = state.products.filter(function (p) { return p.isSample; }).length;
    if (!count) {
      toast('There is no sample data to remove.', 'info');
      return;
    }
    confirmDialog({
      title: 'Remove sample data?',
      message: 'This removes the ' + count + ' demo product' + (count === 1 ? '' : 's') + ' you loaded. Your own records are not affected.',
      confirmText: 'Remove samples',
      danger: true
    }).then(function (confirmed) {
      if (!confirmed) return;
      state.products = state.products.filter(function (p) { return !p.isSample; });
      saveProducts();
      toast('Sample data removed.', 'success');
      renderView();
    });
  }

  /* =========================================================================
     NOTIFICATIONS
     ========================================================================= */

  function enableNotifications() {
    if (!('Notification' in window)) {
      toast('This browser does not support notifications.', 'error');
      return;
    }
    if (Notification.permission === 'granted') {
      state.settings.notifyEnabled = true;
      saveSettings();
      toast('Notifications are already enabled.', 'info');
      return;
    }
    if (Notification.permission === 'denied') {
      toast('Notifications are blocked. Update this site\'s permissions in your browser settings.', 'error', 6000);
      return;
    }

    Notification.requestPermission().then(function (permission) {
      if (permission === 'granted') {
        state.settings.notifyEnabled = true;
        saveSettings();
        toast('Browser notifications enabled for this device.', 'success');
      } else {
        toast('Notification permission was not granted.', 'warning');
      }
      renderView();
    }).catch(function () {
      toast('Could not request notification permission.', 'error');
    });
  }

  function notifyNow() {
    if (!('Notification' in window) || Notification.permission !== 'granted') {
      toast('Enable browser notifications first.', 'warning');
      return;
    }

    const upcoming = state.products
      .map(function (p) { return { product: p, status: getStatus(p) }; })
      .filter(function (x) { return x.status.days !== null && x.status.days >= 0 && x.status.days <= 30; })
      .sort(function (a, b) { return a.status.days - b.status.days; });

    if (!upcoming.length) {
      toast('Nothing expiring in the next 30 days. 🎉', 'success');
      return;
    }

    const first = upcoming[0];
    const body = upcoming.length === 1
      ? first.product.name + ' expires in ' + pluralDays(first.status.days) + '.'
      : first.product.name + ' expires in ' + pluralDays(first.status.days) +
        ', and ' + (upcoming.length - 1) + ' more product' + (upcoming.length - 1 === 1 ? '' : 's') + ' expire within 30 days.';

    try {
      const notification = new Notification('ProofPocket — warranty reminder', {
        body: body,
        icon: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%238B5CF6%22/%3E%3C/svg%3E',
        tag: 'proofpocket-expiry'
      });
      notification.onclick = function () {
        window.focus();
        notification.close();
      };
      toast('Notification sent.', 'success');
    } catch (err) {
      toast('Could not display the notification.', 'error');
    }
  }

  /* =========================================================================
     ICS EXPORT
     ========================================================================= */

  function icsEscape(text) {
    return String(text)
      .replace(/\\/g, '\\\\')
      .replace(/;/g, '\\;')
      .replace(/,/g, '\\,')
      .replace(/\r?\n/g, '\\n');
  }

  function exportICS() {
    const items = state.products
      .map(function (p) { return { product: p, status: getStatus(p) }; })
      .filter(function (x) { return !!x.status.expiryISO; })
      .sort(function (a, b) { return a.status.expiryISO < b.status.expiryISO ? -1 : 1; });

    if (!items.length) {
      toast('Nothing to export — no warranty expiry dates yet.', 'warning');
      return;
    }

    const dtstamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//ProofPocket//Warranty Expiry//EN',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'X-WR-CALNAME:ProofPocket Warranty Expiries'
    ];

    items.forEach(function (item) {
      const product = item.product;
      const expiry = parseISODate(item.status.expiryISO);
      if (!expiry) return;
      const nextDay = addDaysClamped(expiry, 1);
      const startStr = item.status.expiryISO.replace(/-/g, '');
      const endStr = toISODate(nextDay).replace(/-/g, '');

      const description = [
        product.brand ? 'Brand: ' + product.brand : '',
        product.model ? 'Model: ' + product.model : '',
        product.serial ? 'Serial: ' + product.serial : '',
        product.store ? 'Store: ' + product.store : '',
        'Added with ProofPocket'
      ].filter(Boolean).join(' | ');

      lines.push('BEGIN:VEVENT');
      lines.push('UID:' + icsEscape(product.id) + '@proofpocket.local');
      lines.push('DTSTAMP:' + dtstamp);
      lines.push('DTSTART;VALUE=DATE:' + startStr);
      lines.push('DTEND;VALUE=DATE:' + endStr);
      lines.push('SUMMARY:' + icsEscape('Warranty expires: ' + product.name));
      lines.push('DESCRIPTION:' + icsEscape(description));
      lines.push('TRANSP:TRANSPARENT');
      lines.push('END:VEVENT');
    });

    lines.push('END:VCALENDAR');

    const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
    const filename = 'proofpocket-warranty-expiry-' + toISODate(todayLocal()) + '.ics';

    try {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      toast('Exported ' + items.length + ' expiry date' + (items.length === 1 ? '' : 's') + ' to calendar.', 'success');
    } catch (err) {
      console.error('[ProofPocket] ICS export failed:', err);
      toast('Could not create the calendar file.', 'error');
    }
  }

  /* =========================================================================
     CLEAR ALL DATA
     ========================================================================= */

  function clearAllData() {
    confirmDialog({
      title: 'Delete all application data?',
      message: 'Every product, warranty record, receipt attachment and preference stored in this browser will be permanently deleted. This cannot be undone.',
      confirmText: 'Delete everything',
      danger: true,
      requireText: 'DELETE'
    }).then(function (confirmed) {
      if (!confirmed) return;
      try {
        localStorage.removeItem(LS_PRODUCTS);
        localStorage.removeItem(LS_SETTINGS);
      } catch (err) {
        console.warn('[ProofPocket] Could not clear storage:', err);
      }
      state.products = [];
      state.settings = defaultSettings();
      state.ui = {
        search: '', category: 'all', status: 'all', sort: 'newest',
        view: 'grid', page: 1, expiryRange: 'upcoming'
      };
      saveSettings();
      document.body.classList.remove('sidebar-collapsed');
      toast('All data cleared.', 'success');
      renderView();
    });
  }

  /* =========================================================================
     GLOBAL EVENT HANDLING
     ========================================================================= */

  function handleAction(action, element) {
    switch (action) {
      case 'add-product':
        openProductForm(null);
        break;

      case 'open-product': {
        const id = element.getAttribute('data-id');
        if (id) openProductDetail(id);
        break;
      }

      case 'edit-product': {
        const id = element.getAttribute('data-id');
        if (id) openProductForm(id);
        break;
      }

      case 'delete-product': {
        const id = element.getAttribute('data-id');
        if (id) deleteProduct(id);
        break;
      }

      case 'set-view': {
        const view = element.getAttribute('data-view');
        if (view === 'grid' || view === 'list') {
          state.ui.view = view;
          state.settings.view = view;
          saveSettings();
          renderView();
        }
        break;
      }

      case 'page': {
        const page = Number(element.getAttribute('data-page'));
        if (isFinite(page) && page >= 1) {
          state.ui.page = page;
          renderProductsResults();
          const results = document.getElementById('productsResults');
          if (results) {
            try { results.scrollIntoView({ block: 'start', behavior: 'smooth' }); } catch (e) {}
          }
        }
        break;
      }

      case 'clear-filter': {
        const filter = element.getAttribute('data-filter');
        if (filter === 'search') state.ui.search = '';
        else if (filter === 'category') state.ui.category = 'all';
        else if (filter === 'status') state.ui.status = 'all';
        state.ui.page = 1;
        renderView();
        break;
      }

      case 'clear-search': {
        state.ui.search = '';
        state.ui.page = 1;
        const input = document.getElementById('productSearch');
        if (input) {
          input.value = '';
          try { input.focus(); } catch (e) {}
        }
        renderProductsResults();
        break;
      }

      case 'reset-filters':
        state.ui.search = '';
        state.ui.category = 'all';
        state.ui.status = 'all';
        state.ui.sort = 'newest';
        state.ui.page = 1;
        renderView();
        break;

      /* --- NEW: switch the Expirations range filter --- */
      case 'expiry-range': {
        const range = element.getAttribute('data-range');
        const valid = EXPIRY_TABS.some(function (t) { return t.id === range; });
        if (valid && range !== state.ui.expiryRange) {
          state.ui.expiryRange = range;
          renderView();
        }
        break;
      }

      case 'load-samples':
        loadSampleData();
        break;

      case 'remove-samples':
        removeSampleData();
        break;

      case 'enable-notifications':
        enableNotifications();
        break;

      case 'notify-now':
        notifyNow();
        break;

      case 'go-expirations':
        location.hash = '#/expirations';
        break;

      case 'export-ics':
        exportICS();
        break;

      case 'clear-data':
        clearAllData();
        break;

      case 'toggle-sidebar': {
        const collapsed = !document.body.classList.contains('sidebar-collapsed');
        document.body.classList.toggle('sidebar-collapsed', collapsed);
        state.settings.sidebarCollapsed = collapsed;
        saveSettings();
        break;
      }

      default:
        break;
    }
  }

  document.addEventListener('click', function (event) {
    const actionEl = event.target.closest('[data-action]');
    if (!actionEl) return;
    event.preventDefault();
    handleAction(actionEl.getAttribute('data-action'), actionEl);
  });

  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const target = event.target;
    if (!target || typeof target.closest !== 'function') return;
    if (target.tagName === 'BUTTON' || target.tagName === 'A' || target.tagName === 'INPUT') return;

    const card = target.closest('[data-action="open-product"]');
    if (card) {
      event.preventDefault();
      const id = card.getAttribute('data-id');
      if (id) openProductDetail(id);
    }
  });

  document.addEventListener('change', function (event) {
    const target = event.target;
    if (!target) return;

    switch (target.id) {
      case 'filterCategory':
        state.ui.category = target.value;
        state.ui.page = 1;
        renderProductsResults();
        break;

      case 'filterStatus':
        state.ui.status = target.value;
        state.ui.page = 1;
        renderProductsResults();
        break;

      case 'sortBy':
        state.ui.sort = target.value;
        state.ui.page = 1;
        renderProductsResults();
        break;

      case 'setDateFormat':
        state.settings.dateFormat = target.value;
        saveSettings();
        toast('Date format updated.', 'success');
        renderView();
        break;

      case 'setCurrency':
        state.settings.currency = target.value;
        saveSettings();
        toast('Currency updated.', 'success');
        renderView();
        break;

      default:
        break;
    }
  });

  /* Live search inside the Product Library (does not re-render the input itself) */
  document.addEventListener('input', function (event) {
    const target = event.target;
    if (!target || target.id !== 'productSearch') return;
    state.ui.search = target.value;
    state.ui.page = 1;
    renderProductsResults();
  });

  document.addEventListener('submit', function (event) {
    if (event.target && event.target.id === 'quickSearchForm') {
      event.preventDefault();
      const input = document.getElementById('quickSearch');
      state.ui.search = input ? input.value : '';
      state.ui.page = 1;
      if (state.route === 'products') {
        renderProductsResults();
      } else {
        location.hash = '#/products';
      }
    }
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      if (document.getElementById('modalRoot') && document.getElementById('modalRoot').children.length) {
        closeModal();
      }
      return;
    }

    const target = event.target;
    const tag = target && target.tagName ? target.tagName.toLowerCase() : '';
    const isTyping = tag === 'input' || tag === 'textarea' || tag === 'select' ||
                     (target && target.isContentEditable);

    if (isTyping) return;

    if (event.key === '/') {
      event.preventDefault();
      if (state.route === 'products') {
        const el = document.getElementById('productSearch');
        if (el) { el.focus(); el.select(); }
      } else {
        location.hash = '#/products';
        setTimeout(function () {
          const el = document.getElementById('productSearch');
          if (el) { el.focus(); el.select(); }
        }, 90);
      }
      return;
    }

    if (event.key.toLowerCase() === 'n') {
      event.preventDefault();
      openProductForm(null);
    }
  });

  window.addEventListener('hashchange', renderView);

  window.addEventListener('focus', function () {
    if (state.route === 'dashboard' || state.route === 'expirations') renderView();
  });

  /* =========================================================================
     PWA
     ========================================================================= */

  function initPWA() {
    try {
      const manifest = {
        name: 'ProofPocket — Warranty & Receipt Manager',
        short_name: 'ProofPocket',
        description: 'Track product warranties, receipts and expiry dates privately on your device.',
        start_url: '.',
        scope: '.',
        display: 'standalone',
        background_color: '#0B1020',
        theme_color: '#0B1020',
        orientation: 'portrait-primary',
        icons: [{
          src: 'data:image/svg+xml,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' +
              '<rect width="512" height="512" rx="112" fill="#8B5CF6"/>' +
              '<path d="M256 112l112 48v96c0 67.2-46.4 121.6-112 144-65.6-22.4-112-76.8-112-144v-96l112-48z" fill="#ffffff"/>' +
              '<path d="M212 256l32 32 64-64" stroke="#8B5CF6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>' +
            '</svg>'
          ),
          sizes: '512x512',
          type: 'image/svg+xml',
          purpose: 'any maskable'
        }]
      };

      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = url;
      document.head.appendChild(link);
    } catch (err) {
      console.warn('[ProofPocket] PWA manifest unavailable:', err);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {
          /* No service worker present — the app still works fully offline-capable via cache-less static files. */
        });
      });
    }
  }

  /* =========================================================================
     INITIAL LOAD
     ========================================================================= */

  function renderSkeleton() {
    const view = document.getElementById('view');
    if (!view) return;
    let cards = '';
    for (let i = 0; i < 5; i++) {
      cards += '<div class="card p-4">' +
                 '<div class="skeleton h-9 w-9 rounded-xl"></div>' +
                 '<div class="skeleton mt-3 h-6 w-16 rounded"></div>' +
                 '<div class="skeleton mt-2 h-3 w-24 rounded"></div>' +
               '</div>';
    }
    let rows = '';
    for (let i = 0; i < 4; i++) {
      rows += '<div class="flex items-center gap-3 px-4 py-3">' +
                '<div class="skeleton h-9 w-9 rounded-lg"></div>' +
                '<div class="flex-1">' +
                  '<div class="skeleton h-3 w-40 rounded"></div>' +
                  '<div class="skeleton mt-2 h-3 w-24 rounded"></div>' +
                '</div>' +
              '</div>';
    }
    view.innerHTML =
      '<div class="flex flex-col gap-5">' +
        '<div class="skeleton h-7 w-48 rounded"></div>' +
        '<div class="grid grid-cols-2 gap-3 lg:grid-cols-5 lg:gap-4">' + cards + '</div>' +
        '<div class="card overflow-hidden"><div class="skeleton m-4 h-4 w-32 rounded"></div>' + rows + '</div>' +
      '</div>';
  }

  function init() {
    renderSkeleton();
    refreshIcons();

    loadSettings();
    loadProducts();

    document.body.classList.toggle('sidebar-collapsed', !!state.settings.sidebarCollapsed);
    state.ui.view = state.settings.view;

    setTimeout(function () {
      if (!location.hash) {
        location.replace('#/dashboard');
      }
      renderView();
      initPWA();
    }, 260);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
