<style>
  :root { color-scheme: dark; }
  html, body { background-color: #0B1020; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #0B1020; }
  ::-webkit-scrollbar-thumb { background: #1f2a44; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #2b3a5e; }

  .fade-in { animation: ppFade .26s ease both; }
  @keyframes ppFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .modal-panel { animation: ppModal .22s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes ppModal { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }

  .toast-in { animation: ppToast .22s ease both; }
  @keyframes ppToast { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }

  .skeleton { background: linear-gradient(90deg, #171F35 25%, #1e2843 37%, #171F35 63%); background-size: 400% 100%; animation: ppShimmer 1.4s ease infinite; }
  @keyframes ppShimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.7); cursor: pointer; }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Collapsible desktop sidebar */
  @media (min-width: 1024px) {
    .sidebar-collapsed #sidebar   { width: 5rem; }
    .sidebar-collapsed #mainWrap  { padding-left: 5rem; }
    .sidebar-collapsed .nav-label { display: none; }
    .sidebar-collapsed .nav-item  { justify-content: center; padding-left: 0; padding-right: 0; }
    .sidebar-collapsed .brand-text { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>

<script>
(function () {
  'use strict';

  /* =========================================================================
     CONSTANTS & CONFIG
     ========================================================================= */

  const LS_PRODUCTS   = 'proofpocket.products.v1';
  const LS_SETTINGS   = 'proofpocket.settings.v1';
  const MAX_RECEIPT_BYTES = 1.5 * 1024 * 1024;   // 1.5 MB per attachment
  const PAGE_SIZE     = 12;

  const CATEGORIES = [
    { id: 'Electronics',               icon: 'cpu' },
    { id: 'Appliances',                icon: 'washing-machine' },
    { id: 'Computers and accessories', icon: 'laptop' },
    { id: 'Mobile phones',             icon: 'smartphone' },
    { id: 'Vehicles',                  icon: 'car' },
    { id: 'Furniture',                 icon: 'sofa' },
    { id: 'Clothing',                  icon: 'shirt' },
    { id: 'Other',                     icon: 'package' }
  ];

  const CURRENCIES = {
    INR: '₹', USD: '$', EUR: '€', GBP: '£', AED: 'د.إ',
    AUD: 'A$', CAD: 'C$', SGD: 'S$', JPY: '¥'
  };

  const STATUS_META = {
    active:  { label: 'Active',        badge: 'bg-success/15 text-success border border-success/25', bar: 'bg-success' },
    soon:    { label: 'Expiring Soon', badge: 'bg-warning/15 text-warning border border-warning/25', bar: 'bg-warning' },
    today:   { label: 'Expires Today', badge: 'bg-warning/20 text-warning border border-warning/35', bar: 'bg-warning' },
    expired: { label: 'Expired',       badge: 'bg-danger/15 text-danger border border-danger/25',    bar: 'bg-danger'  },
    none:    { label: 'No Warranty',   badge: 'bg-white/5 text-muted border border-white/10',        bar: 'bg-muted'   }
  };

  const STATUS_ORDER = ['active', 'soon', 'today', 'expired', 'none'];

  /* Expirations tab ids — kept at module scope so handlers can validate. */
  const EXPIRY_TABS = [
    { id: 'upcoming', label: 'All upcoming', icon: 'calendar-clock', field: 'upcoming' },
    { id: '7',        label: '7 days',       icon: 'alarm-clock',    field: 'week'     },
    { id: '30',       label: '30 days',      icon: 'clock',          field: 'month'    },
    { id: '90',       label: '90 days',      icon: 'calendar',       field: 'quarter'  },
    { id: 'expired',  label: 'Expired',      icon: 'shield-x',       field: 'expired'  }
  ];

  /* =========================================================================
     SMALL UTILITIES
     ========================================================================= */

  function esc(value) {
    if (value === null || value === undefined) return '';
    return String(value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + '_' +
           Math.random().toString(36).slice(2, 9);
  }

  function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }

  function parseISODate(str) {
    if (typeof str !== 'string') return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str.trim());
    if (!m) return null;
    const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
    const dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
    return dt;
  }

  function toISODate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }

  function todayLocal() {
    const n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  function daysBetween(a, b) {
    const ua = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
    const ub = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round((ub - ua) / 86400000);
  }

  function addMonthsClamped(date, months) {
    const y = date.getFullYear();
    const m = date.getMonth();
    const day = date.getDate();
    const target = new Date(y, m, 1);
    target.setMonth(target.getMonth() + months);
    const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
    return new Date(target.getFullYear(), target.getMonth(), Math.min(day, lastDay));
  }

  function addDaysClamped(date, days) {
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    d.setDate(d.getDate() + days);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  /* =========================================================================
     STATE
     ========================================================================= */

  function defaultSettings() {
    return {
      dateFormat: 'DD/MM/YYYY',
      currency: 'INR',
      notifyEnabled: false,
      view: 'grid',
      sidebarCollapsed: false
    };
  }

  const state = {
    products: [],
    settings: defaultSettings(),
    ui: {
      search: '',
      category: 'all',
      status: 'all',
      sort: 'newest',
      view: 'grid',
      page: 1,
      expiryRange: 'upcoming'
    },
    route: 'dashboard'
  };

  /* =========================================================================
     PERSISTENCE
     ========================================================================= */

  function isValidProduct(p) {
    return p && typeof p === 'object' &&
           typeof p.id === 'string' && p.id.length > 0 &&
           typeof p.name === 'string';
  }

  function loadProducts() {
    try {
      const raw = localStorage.getItem(LS_PRODUCTS);
      if (!raw) { state.products = []; return; }
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error('Corrupted product store');
      state.products = parsed.filter(isValidProduct).map(normaliseProduct);
    } catch (err) {
      console.error('[ProofPocket] Could not read saved products:', err);
      state.products = [];
      toast('Saved data could not be read. Starting with an empty library.', 'error');
    }
  }

  function normaliseProduct(p) {
    return {
      id: p.id,
      name: String(p.name || 'Untitled product'),
      brand: typeof p.brand === 'string' ? p.brand : '',
      category: CATEGORIES.some(function (c) { return c.id === p.category; }) ? p.category : 'Other',
      model: typeof p.model === 'string' ? p.model : '',
      serial: typeof p.serial === 'string' ? p.serial : '',
      price: (p.price === null || p.price === undefined || p.price === '' || isNaN(Number(p.price))) ? null : Number(p.price),
      purchaseDate: typeof p.purchaseDate === 'string' ? p.purchaseDate : '',
      warrantyDuration: (p.warrantyDuration === null || p.warrantyDuration === undefined || p.warrantyDuration === '' || isNaN(Number(p.warrantyDuration))) ? null : Number(p.warrantyDuration),
      warrantyUnit: ['days', 'months', 'years'].indexOf(p.warrantyUnit) >= 0 ? p.warrantyUnit : 'years',
      customExpiry: typeof p.customExpiry === 'string' && p.customExpiry ? p.customExpiry : null,
      store: typeof p.store === 'string' ? p.store : '',
      orderId: typeof p.orderId === 'string' ? p.orderId : '',
      notes: typeof p.notes === 'string' ? p.notes : '',
      receipt: (p.receipt && typeof p.receipt === 'object' && typeof p.receipt.dataUrl === 'string') ? {
        name: String(p.receipt.name || 'receipt'),
        type: String(p.receipt.type || ''),
        size: Number(p.receipt.size) || 0,
        dataUrl: p.receipt.dataUrl
      } : null,
      createdAt: typeof p.createdAt === 'string' ? p.createdAt : new Date().toISOString(),
      updatedAt: typeof p.updatedAt === 'string' ? p.updatedAt : new Date().toISOString(),
      isSample: !!p.isSample
    };
  }

  function saveProducts() {
    try {
      localStorage.setItem(LS_PRODUCTS, JSON.stringify(state.products));
      return true;
    } catch (err) {
      console.error('[ProofPocket] Save failed:', err);
      toast('Could not save — browser storage is full. Try removing large receipt attachments.', 'error', 6000);
      return false;
    }
  }

  function loadSettings() {
    try {
      const raw = localStorage.getItem(LS_SETTINGS);
      const base = defaultSettings();
      if (!raw) { state.settings = base; return; }
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') throw new Error('Corrupted settings');
      state.settings = Object.assign(base, parsed);
      if (!CURRENCIES[state.settings.currency]) state.settings.currency = 'INR';
      if (['DD/MM/YYYY', 'MM/DD/YYYY', 'YYYY-MM-DD'].indexOf(state.settings.dateFormat) < 0) {
        state.settings.dateFormat = 'DD/MM/YYYY';
      }
      if (['grid', 'list'].indexOf(state.settings.view) < 0) state.settings.view = 'grid';
    } catch (err) {
      console.warn('[ProofPocket] Settings reset:', err);
      state.settings = defaultSettings();
    }
    state.ui.view = state.settings.view;
  }

  function saveSettings() {
    try {
      localStorage.setItem(LS_SETTINGS, JSON.stringify(state.settings));
    } catch (err) {
      console.warn('[ProofPocket] Could not save settings:', err);
    }
  }

  function storageInfo() {
    let bytes = 0;
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.indexOf('proofpocket.') === 0) {
          bytes += (localStorage.getItem(key) || '').length * 2;
        }
      }
    } catch (err) { /* storage may be unavailable */ }
    const limit = 5 * 1024 * 1024;
    return { bytes: bytes, limit: limit, pct: clamp((bytes / limit) * 100, 0, 100) };
  }

  function formatBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / (1024 * 1024)).toFixed(2) + ' MB';
  }

  /* =========================================================================
     FORMATTING
     ========================================================================= */

  function formatDate(dateOrISO) {
    if (!dateOrISO) return '—';
    let d = dateOrISO;
    if (typeof dateOrISO === 'string') {
      d = parseISODate(dateOrISO);
      if (!d) return '—';
    }
    if (!(d instanceof Date) || isNaN(d.getTime())) return '—';
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yyyy = String(d.getFullYear());
    switch (state.settings.dateFormat) {
      case 'MM/DD/YYYY': return mm + '/' + dd + '/' + yyyy;
      case 'YYYY-MM-DD': return yyyy + '-' + mm + '-' + dd;
      default:           return dd + '/' + mm + '/' + yyyy;
    }
  }

  function formatMoney(value) {
    if (value === null || value === undefined || value === '' || isNaN(Number(value))) return '—';
    const symbol = CURRENCIES[state.settings.currency] || '₹';
    const num = Number(value);
    let formatted;
    try {
      formatted = num.toLocaleString(undefined, { maximumFractionDigits: 2 });
    } catch (err) {
      formatted = String(num);
    }
    return symbol + formatted;
  }

  function pluralDays(n) {
    return Math.abs(n) + (Math.abs(n) === 1 ? ' day' : ' days');
  }

  function formatMonthYear(month, year) {
    const d = new Date(year, month, 1);
    try {
      return d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    } catch (err) {
      const names = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      return names[month] + ' ' + year;
    }
  }

  /* =========================================================================
     WARRANTY CALCULATION
     ========================================================================= */

  function computeExpiryDate(product) {
    if (product.customExpiry) {
      const custom = parseISODate(product.customExpiry);
      if (custom) return custom;
    }
    const duration = Number(product.warrantyDuration);
    if (!product.purchaseDate) return null;
    if (product.warrantyDuration === null || product.warrantyDuration === undefined) return null;
    if (!isFinite(duration) || duration <= 0) return null;

    const start = parseISODate(product.purchaseDate);
    if (!start) return null;

    if (product.warrantyUnit === 'days')   return addDaysClamped(start, duration);
    if (product.warrantyUnit === 'months') return addMonthsClamped(start, duration);
    return addMonthsClamped(start, duration * 12);
  }

  function getStatus(product) {
    const expiry = computeExpiryDate(product);

    if (!expiry) {
      return {
        key: 'none', label: STATUS_META.none.label,
        expiry: null, expiryISO: null, days: null, progress: 0
      };
    }

    const today = todayLocal();
    const days = daysBetween(today, expiry);

    let key;
    if (days < 0)        key = 'expired';
    else if (days === 0) key = 'today';
    else if (days <= 30) key = 'soon';
    else                 key = 'active';

    let progress = 100;
    const start = parseISODate(product.purchaseDate);
    if (start) {
      const total = daysBetween(start, expiry);
      const elapsed = daysBetween(start, today);
      progress = total > 0 ? clamp((elapsed / total) * 100, 0, 100) : 100;
    }

    return {
      key: key,
      label: STATUS_META[key].label,
      expiry: expiry,
      expiryISO: toISODate(expiry),
      days: days,
      progress: progress
    };
  }

  function warrantyDaysLabel(st) {
    if (st.days === null) return 'No warranty';
    if (st.days < 0) return 'Expired ' + pluralDays(st.days) + ' ago';
    if (st.days === 0) return 'Expires today';
    return pluralDays(st.days) + ' left';
  }

  function computeStats(products) {
    const s = { total: products.length, active: 0, soon: 0, today: 0, expired: 0, none: 0 };
    for (let i = 0; i < products.length; i++) {
      const st = getStatus(products[i]);
      s[st.key] += 1;
    }
    s.expiring30 = s.soon + s.today;
    return s;
  }

  function computeTotalValue(products) {
    let sum = 0;
    let priced = 0;
    for (let i = 0; i < products.length; i++) {
      const price = products[i].price;
      if (price !== null && price !== undefined && isFinite(price)) {
        sum += Number(price);
        priced += 1;
      }
    }
    return { sum: sum, priced: priced };
  }

  function greetingWord() {
    const h = new Date().getHours();
    if (h < 5) return 'Good night';
    if (h < 12) return 'Good morning';
    if (h < 17) return 'Good afternoon';
    if (h < 21) return 'Good evening';
    return 'Good night';
  }

  function getAttentionItems(products) {
    const out = [];
    for (let i = 0; i < products.length; i++) {
      const st = getStatus(products[i]);
      if (st.days === null) continue;
      if (st.days < 0 || st.days <= 7) {
        out.push({ product: products[i], status: st });
      }
    }
    out.sort(function (a, b) { return a.status.days - b.status.days; });
    return out;
  }

  function computeCategoryCounts(products) {
    const map = {};
    for (let i = 0; i < products.length; i++) {
      const cat = products[i].category || 'Other';
      map[cat] = (map[cat] || 0) + 1;
    }
    return CATEGORIES
      .map(function (c) { return { id: c.id, icon: c.icon, count: map[c.id] || 0 }; })
      .filter(function (c) { return c.count > 0; })
      .sort(function (a, b) { return b.count - a.count; });
  }

  /* =========================================================================
     TOASTS
     ========================================================================= */

  const TOAST_STYLES = {
    success: { icon: 'circle-check',  ring: 'border-success/30', accent: 'text-success' },
    error:   { icon: 'circle-x',      ring: 'border-danger/30',  accent: 'text-danger'  },
    warning: { icon: 'triangle-alert',ring: 'border-warning/30', accent: 'text-warning' },
    info:    { icon: 'info',          ring: 'border-primary/30', accent: 'text-primary' }
  };

  function toast(message, type, duration) {
    const kind = TOAST_STYLES[type] ? type : 'info';
    const style = TOAST_STYLES[kind];
    const root = document.getElementById('toastRoot');
    if (!root) return;

    const node = document.createElement('div');
    node.className = 'toast-in pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-xl border ' +
                     style.ring + ' bg-card/95 px-4 py-3 shadow-2xl backdrop-blur-xl';
    node.setAttribute('role', 'status');

    const iconWrap = document.createElement('span');
    iconWrap.className = 'mt-0.5 shrink-0 ' + style.accent;
    iconWrap.innerHTML = '<i data-lucide="' + style.icon + '" class="h-4 w-4"></i>';

    const text = document.createElement('p');
    text.className = 'min-w-0 flex-1 text-sm text-ink';
    text.textContent = String(message);

    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'shrink-0 rounded-md p-1 text-muted transition hover:bg-white/10 hover:text-ink';
    closeBtn.setAttribute('aria-label', 'Dismiss notification');
    closeBtn.innerHTML = '<i data-lucide="x" class="h-3.5 w-3.5"></i>';

    node.appendChild(iconWrap);
    node.appendChild(text);
    node.appendChild(closeBtn);
    root.appendChild(node);

    if (window.lucide) window.lucide.createIcons();

    let removed = false;
    function remove() {
      if (removed) return;
      removed = true;
      node.style.transition = 'opacity .18s ease, transform .18s ease';
      node.style.opacity = '0';
      node.style.transform = 'translateY(6px)';
      setTimeout(function () { node.remove(); }, 190);
    }

    closeBtn.addEventListener('click', remove);
    setTimeout(remove, duration || 4200);
  }

  /* =========================================================================
     MODAL SYSTEM
     ========================================================================= */

  let activeModal = { onClose: null, previousFocus: null };

  function showModal(innerHTML, options) {
    const opts = options || {};
    closeModal();

    const root = document.getElementById('modalRoot');
    if (!root) return;

    activeModal.previousFocus = document.activeElement;

    const wrapper = document.createElement('div');
    wrapper.className = 'fixed inset-0 z-50 flex items-end justify-center sm:items-center sm:p-4';
    wrapper.innerHTML =
      '<div class="absolute inset-0 bg-black/70 backdrop-blur-sm" data-close></div>' +
      '<div class="modal-panel relative flex max-h-[92vh] w-full ' + (opts.size || 'max-w-2xl') +
      ' flex-col overflow-hidden rounded-t-2xl border border-white/10 bg-card shadow-2xl sm:rounded-2xl" ' +
      'role="dialog" aria-modal="true">' + innerHTML + '</div>';

    root.appendChild(wrapper);
    document.body.style.overflow = 'hidden';

    activeModal.onClose = opts.onClose || null;

    wrapper.querySelectorAll('[data-close]').forEach(function (el) {
      el.addEventListener('click', closeModal);
    });

    if (window.lucide) window.lucide.createIcons();

    const focusTarget = wrapper.querySelector('[autofocus]') ||
                        wrapper.querySelector('input:not([type=hidden]), select, textarea, button');
    if (focusTarget) {
      setTimeout(function () { try { focusTarget.focus(); } catch (e) {} }, 60);
    }
  }

  function closeModal() {
    const root = document.getElementById('modalRoot');
    if (root) root.innerHTML = '';
    document.body.style.overflow = '';

    const cb = activeModal.onClose;
    const prev = activeModal.previousFocus;
    activeModal = { onClose: null, previousFocus: null };

    if (prev && typeof prev.focus === 'function' && document.contains(prev)) {
      try { prev.focus(); } catch (e) {}
    }
    if (typeof cb === 'function') cb();
  }

  function confirmDialog(config) {
    return new Promise(function (resolve) {
      let settled = false;
      function finish(value) {
        if (settled) return;
        settled = true;
        resolve(value);
      }

      const requireText = config.requireText || null;
      const danger = config.danger !== false;

      const body =
        '<div class="p-5 sm:p-6">' +
          '<div class="flex items-start gap-3">' +
            '<div class="grid h-10 w-10 shrink-0 place-items-center rounded-xl ' +
              (danger ? 'bg-danger/15 text-danger' : 'bg-primary/15 text-primary') + '">' +
              '<i data-lucide="' + (danger ? 'triangle-alert' : 'info') + '" class="h-5 w-5"></i>' +
            '</div>' +
            '<div class="min-w-0">' +
              '<h2 class="text-base font-semibold leading-snug">' + esc(config.title || 'Are you sure?') + '</h2>' +
              '<p class="mt-1.5 text-sm leading-relaxed text-muted">' + esc(config.message || '') + '</p>' +
            '</div>' +
          '</div>' +
          (requireText ?
            '<div class="mt-4">' +
              '<label class="label" for="confirmTextInput">Type ' +
                '<span class="font-mono font-semibold text-ink">' + esc(requireText) + '</span> to confirm</label>' +
              '<input id="confirmTextInput" type="text" class="input" autocomplete="off" spellcheck="false" />' +
            '</div>' : '') +
          '<div class="mt-5 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">' +
            '<button type="button" class="btn-ghost" data-close>' + esc(config.cancelText || 'Cancel') + '</button>' +
            '<button type="button" class="' + (danger ? 'btn-danger' : 'btn-primary') + '" id="confirmOk"' +
              (requireText ? ' disabled' : '') + '>' + esc(config.confirmText || 'Confirm') + '</button>' +
          '</div>' +
        '</div>';

      showModal(body, { size: 'max-w-md', onClose: function () { finish(false); } });

      const okBtn = document.getElementById('confirmOk');
      if (!okBtn) { finish(false); return; }

      if (requireText) {
        const input = document.getElementById('confirmTextInput');
        if (input) {
          input.addEventListener('input', function () {
            okBtn.disabled = input.value.trim() !== requireText;
          });
          setTimeout(function () { try { input.focus(); } catch (e) {} }, 60);
        }
      }

      okBtn.addEventListener('click', function () {
        finish(true);
        closeModal();
      });
    });
  }

  /* =========================================================================
     SHARED RENDER HELPERS
     ========================================================================= */

  function refreshIcons() {
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }
  }

  function categoryMeta(id) {
    for (let i = 0; i < CATEGORIES.length; i++) {
      if (CATEGORIES[i].id === id) return CATEGORIES[i];
    }
    return CATEGORIES[CATEGORIES.length - 1];
  }

  function statusBadgeHTML(st) {
    const meta = STATUS_META[st.key] || STATUS_META.none;
    return '<span class="chip ' + meta.badge + '">' + esc(meta.label) + '</span>';
  }

  function progressHTML(st, product) {
    if (!st.expiry) {
      return '<div class="mt-3">' +
               '<div class="h-1.5 w-full overflow-hidden rounded-full bg-white/5"></div>' +
               '<p class="mt-1.5 text-[11px] text-muted">No warranty tracked</p>' +
             '</div>';
    }

    const meta = STATUS_META[st.key] || STATUS_META.none;

    if (st.days < 0) {
      return '<div class="mt-3">' +
               '<div class="h-1.5 w-full overflow-hidden rounded-full bg-white/5">' +
                 '<div class="h-full bg-danger" style="width:100%"></div>' +
               '</div>' +
               '<p class="mt-1.5 text-[11px] text-danger">Expired ' + pluralDays(st.days) + ' ago</p>' +
             '</div>';
    }

    let message;
    if (st.days === 0) message = 'Expires today';
    else message = pluralDays(st.days) + ' remaining';

    const tone = (st.key === 'soon' || st.key === 'today') ? 'text-warning' : 'text-success';

    return '<div class="mt-3">' +
             '<div class="h-1.5 w-full overflow-hidden rounded-full bg-white/5">' +
               '<div class="h-full ' + meta.bar + '" style="width:' + st.progress.toFixed(1) + '%"></div>' +
             '</div>' +
             '<p class="mt-1.5 text-[11px] ' + tone + '">' + esc(message) + '</p>' +
           '</div>';
  }

  function emptyStateHTML(opts) {
    return '<div class="card flex flex-col items-center justify-center px-6 py-14 text-center">' +
             '<div class="grid h-16 w-16 place-items-center rounded-2xl bg-primary/10 text-primary">' +
               '<i data-lucide="' + esc(opts.icon || 'package-open') + '" class="h-7 w-7"></i>' +
             '</div>' +
             '<h3 class="mt-4 text-base font-semibold">' + esc(opts.title) + '</h3>' +

             (opts.actions ? '<div class="mt-5 flex flex-col gap-2 sm:flex-row">' + opts.actions + '</div>' : '') +
           '</div>';
  }

  /* =========================================================================
     ROUTER
     ========================================================================= */

  let lastRenderedRoute = null;

  function currentRoute() {
    const hash = (location.hash || '').replace(/^#\/?/, '').toLowerCase();
    if (hash === 'products') return 'products';
    if (hash === 'expirations') return 'expirations';
    if (hash === 'settings') return 'settings';
    return 'dashboard';
  }

  function renderView() {
    const route = currentRoute();
    const routeChanged = route !== lastRenderedRoute;
    state.route = route;

    const view = document.getElementById('view');
    if (!view) return;

    if (route === 'products') {
      view.innerHTML = productsShellHTML();
      renderProductsResults();
    } else if (route === 'expirations') {
      view.innerHTML = expirationsHTML();
    } else if (route === 'settings') {
      view.innerHTML = settingsHTML();
    } else {
      view.innerHTML = dashboardHTML();
    }

    updateNavActive();
    refreshIcons();

    if (routeChanged) {
      lastRenderedRoute = route;
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    syncSearchInputs();
  }

  function updateNavActive() {
    const route = state.route;
    document.querySelectorAll('[data-nav]').forEach(function (link) {
      const isActive = link.getAttribute('data-nav') === route;
      link.classList.toggle('is-active', isActive);
      if (isActive) {
        link.setAttribute('aria-current', 'page');
        link.classList.remove('text-muted');
        link.classList.add('text-ink');
      } else {
        link.removeAttribute('aria-current');
        link.classList.add('text-muted');
        link.classList.remove('text-ink');
      }
    });
  }

  function syncSearchInputs() {
    const input = document.getElementById('productSearch');
    if (input && input.value !== state.ui.search) {
      input.value = state.ui.search;
    }
  }

  /* =========================================================================
     VIEW: DASHBOARD
     ========================================================================= */

  function dashboardHTML() {

    const hasProducts = products.length > 0;

    const addButton =
      '<button type="button" data-action="add-product" class="btn-primary">' +

      '</button>';

    /* ---------- Empty state ---------- */
    if (!hasProducts) {
      return '<div class="fade-in flex flex-col gap-4 sm:gap-5">' +
        emptyHeroHTML() +
        emptyStateHTML({
          icon: 'package-open',
          title: 'Your pocket is empty',
          message: 'Add your first product to start tracking warranties and expiry dates. Everything is stored privately on this device.',
          actions: addButton +
            '<button type="button" data-action="load-samples" class="btn-ghost">' +
              '<i data-lucide="sparkles" class="h-4 w-4"></i><span>Load sample data</span>' +
            '</button>'
        }) +

      .sort(function (a, b) { return a.status.days - b.status.days; })

  function upcomingRowHTML(item) {
    const product = item.product;

        '<span class="shrink-0 text-xs font-semibold ' + tone + '">' + esc(daysLabel) + '</span>' +
      '</button>' +

  function distributionHTML(stats) {
    const total = stats.total || 1;
    const rows = STATUS_ORDER.map(function (key) {
      const count = stats[key] || 0;
      const pct = (count / total) * 100;
      const meta = STATUS_META[key];
      return '<div class="flex items-center gap-3">' +
               '<span class="w-28 shrink-0 text-xs text-muted">' + esc(meta.label) + '</span>' +
               '<span class="relative h-2 flex-1 overflow-hidden rounded-full bg-white/5">' +
                 '<span class="block h-full ' + meta.bar + ' transition-all duration-500" style="width:' + pct.toFixed(1) + '%"></span>' +
               '</span>' +
               '<span class="w-8 shrink-0 text-right text-xs font-semibold tabular-nums">' + count + '</span>' +
             '</div>';
    });
    return '<div class="space-y-3">' + rows.join('') + '</div>';

  function attentionBannerHTML(items, stats) {
    const problems = (stats.today || 0) + (stats.expired || 0) + (stats.soon || 0);
    if (!problems) {
      return '<div class="flex items-center gap-3 rounded-xl border border-success/20 bg-success/5 px-4 py-2.5">' +
               '<i data-lucide="shield-check" class="h-4 w-4 shrink-0 text-success"></i>' +
               '<p class="text-xs text-muted">' +
                 '<span class="font-semibold text-success">All healthy</span> · Nothing expires in the next 30 days' +
               '</p>' +
             '</div>';
    }

    const tone = stats.expired > 0 ? 'danger' : 'warning';
    const cls = tone === 'danger'
      ? 'border-danger/30 bg-danger/5'
      : 'border-warning/30 bg-warning/5';
    const accent = tone === 'danger' ? 'text-danger' : 'text-warning';

    const parts = [];
    if (stats.expired) parts.push(stats.expired + ' expired');
    if (stats.today)   parts.push(stats.today + ' expiring today');
    if (stats.soon)    parts.push(stats.soon + ' expiring soon');

    return '<div class="flex flex-wrap items-center gap-x-3 gap-y-1 rounded-xl border ' + cls + ' px-4 py-2.5">' +
             '<i data-lucide="alert-triangle" class="h-4 w-4 shrink-0 ' + accent + '"></i>' +
             '<p class="text-xs font-semibold ' + accent + '">Needs attention</p>' +
             '<p class="text-xs text-muted">' + esc(parts.join(' · ')) + '</p>' +
             '<a href="#/expirations" class="ml-auto text-xs font-medium ' + accent + ' underline-offset-2 hover:underline">Review →</a>' +
           '</div>';

  function categoryBreakdownHTML(categories, total) {
    if (!categories.length) {
      return '<p class="text-sm text-muted">No products yet.</p>';
    }
    const denominator = total || 1;
    return '<div class="space-y-3">' +
      categories.map(function (c) {
        const pct = (c.count / denominator) * 100;
        return '<div class="flex items-center gap-3">' +
                 '<span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg bg-primary/10 text-primary">' +
                   '<i data-lucide="' + esc(c.icon) + '" class="h-3.5 w-3.5"></i>' +
                 '</span>' +
                 '<span class="w-32 shrink-0 truncate text-xs text-muted">' + esc(c.id) + '</span>' +
                 '<span class="relative h-2 flex-1 overflow-hidden rounded-full bg-white/5">' +
                   '<span class="block h-full bg-primary transition-all duration-500" style="width:' + pct.toFixed(1) + '%"></span>' +
                 '</span>' +
                 '<span class="w-8 shrink-0 text-right text-xs font-semibold tabular-nums">' + c.count + '</span>' +
               '</div>';
      }).join('') +
    '</div>';
  }

    return state.products.some(function (p) { return p.isSample; });

  function getFilteredProducts() {
    const query = state.ui.search.trim().toLowerCase();
    let list = state.products.slice();

    if (query) {
      list = list.filter(function (p) {
        return [p.name, p.brand, p.model, p.serial, p.store, p.category].some(function (value) {
          return String(value || '').toLowerCase().indexOf(query) >= 0;
        });
      });
    }

    if (state.ui.category !== 'all') {
      list = list.filter(function (p) { return p.category === state.ui.category; });
    }

    if (state.ui.status !== 'all') {
      list = list.filter(function (p) { return getStatus(p).key === state.ui.status; });
    }

    function priceOf(p) {
      const n = p.price;
      return (n === null || n === undefined || !isFinite(Number(n))) ? null : Number(n);
    }

    const sort = state.ui.sort;
    list.sort(function (a, b) {
      if (sort === 'oldest') return new Date(a.createdAt) - new Date(b.createdAt);
      if (sort === 'name')   return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
      if (sort === 'expiry') {
        const ea = computeExpiryDate(a);
        const eb = computeExpiryDate(b);
        const ta = ea ? ea.getTime() : Infinity;
        const tb = eb ? eb.getTime() : Infinity;
        if (ta === tb) return a.name.localeCompare(b.name);
        return ta - tb;
      }
      if (sort === 'price-asc' || sort === 'price-desc') {
        const pa = priceOf(a);
        const pb = priceOf(b);
        if (pa === null && pb === null) return a.name.localeCompare(b.name);
        if (pa === null) return 1;
        if (pb === null) return -1;
        if (pa === pb) return a.name.localeCompare(b.name);
        return sort === 'price-asc' ? pa - pb : pb - pa;
      }
      return new Date(b.createdAt) - new Date(a.createdAt);
    });

    return list;
  }

  function updateProductsCount(list, total) {
    const el = document.getElementById('productsCount');
    if (!el) return;

    if (total === 0) {
      el.textContent = 'No products yet';
      return;
    }

    let text = hasActiveFilters()
      ? 'Showing ' + list.length + ' of ' + total + ' product' + (total === 1 ? '' : 's')
      : total + ' product' + (total === 1 ? '' : 's') + ' tracked';

    const value = computeTotalValue(list);
    if (value.priced > 0 && value.sum > 0) {
      text += ' · ' + formatMoney(value.sum) + ' in value';
    }
    el.textContent = text;
  }

  function activeFilterChipHTML(filter, icon, label) {
    return '<span class="inline-flex items-center gap-1 rounded-full border border-primary/25 bg-primary/10 py-1 pl-2.5 pr-1 text-[11px] font-medium text-primary">' +
             '<i data-lucide="' + esc(icon) + '" class="h-3 w-3"></i>' +
             '<span class="max-w-[14rem] truncate">' + esc(label) + '</span>' +
             '<button type="button" data-action="clear-filter" data-filter="' + esc(filter) + '" ' +
               'class="rounded-full p-0.5 transition hover:bg-primary/20" aria-label="Remove filter">' +
               '<i data-lucide="x" class="h-3 w-3"></i>' +
             '</button>' +
           '</span>';
  }

  function renderActiveFilters() {
    const el = document.getElementById('productsActiveFilters');
    if (!el) return;

    const chips = [];
    const q = state.ui.search.trim();
    if (q) {
      chips.push(activeFilterChipHTML('search', 'search', 'Search: “' + q + '”'));
    }
    if (state.ui.category !== 'all') {
      chips.push(activeFilterChipHTML('category', 'tag', state.ui.category));
    }
    if (state.ui.status !== 'all') {
      chips.push(activeFilterChipHTML('status', 'filter', STATUS_META[state.ui.status].label));
    }

    if (!chips.length) {
      el.classList.add('hidden');
      el.innerHTML = '';
      return;
    }

    el.classList.remove('hidden');
    el.innerHTML =
      '<div class="mt-3 flex flex-wrap items-center gap-1.5 border-t border-white/5 pt-3">' +
        chips.join('') +
        '<button type="button" data-action="reset-filters" ' +
          'class="ml-auto inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[11px] font-semibold text-primary transition hover:bg-primary/10">' +
          '<i data-lucide="rotate-ccw" class="h-3 w-3"></i><span>Clear all</span>' +
        '</button>' +
      '</div>';
  }

  function syncClearSearchButton() {
    const btn = document.getElementById('clearSearchBtn');
    if (!btn) return;
    btn.classList.toggle('hidden', !state.ui.search);
  }

  function renderProductsResults() {
    const container = document.getElementById('productsResults');
    if (!container) return;

    const list = getFilteredProducts();
    const total = state.products.length;

    const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (state.ui.page > totalPages) state.ui.page = totalPages;
    if (state.ui.page < 1) state.ui.page = 1;

    const startIndex = (state.ui.page - 1) * PAGE_SIZE;
    const pageItems = list.slice(startIndex, startIndex + PAGE_SIZE);

    updateProductsCount(list, total);
    renderActiveFilters();
    syncClearSearchButton();

    if (!list.length) {
      const noProductsAtAll = total === 0;
      container.innerHTML = emptyStateHTML({
        icon: noProductsAtAll ? 'package-open' : 'search-x',
        title: noProductsAtAll ? 'No products yet' : 'No matching products',
        message: noProductsAtAll
          ? 'Add your first product to start tracking its warranty and receipts.'
          : 'Nothing matches your current search and filters. Try a different term or clear the filters to see everything again.',
        actions: noProductsAtAll
          ? '<button type="button" data-action="add-product" class="btn-primary">' +
              '<i data-lucide="plus" class="h-4 w-4"></i><span>Add Product</span></button>' +
            '<button type="button" data-action="load-samples" class="btn-ghost">' +
              '<i data-lucide="sparkles" class="h-4 w-4"></i><span>Load sample data</span></button>'
          : '<button type="button" data-action="reset-filters" class="btn-primary">' +
              '<i data-lucide="rotate-ccw" class="h-4 w-4"></i><span>Reset filters</span></button>'
      });
      refreshIcons();
      return;
    }

    let html = '';
    if (state.ui.view === 'list') {
      html += '<ul class="card divide-y divide-white/5 overflow-hidden">';
      html += pageItems.map(productListRowHTML).join('');
      html += '</ul>';
    } else {
      html += '<div class="grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-3">';
      html += pageItems.map(productCardHTML).join('');
      html += '</div>';
    }

    const from = startIndex + 1;
    const to = startIndex + pageItems.length;

    html += '<div class="mt-4 flex flex-col items-center justify-between gap-3 sm:flex-row">' +
              '<p class="text-xs text-muted">Showing ' +
                '<span class="font-semibold text-ink">' + from + '–' + to + '</span> of ' + list.length +
              '</p>' +
              (totalPages > 1
                ? '<div class="flex items-center gap-2">' +
                    '<button type="button" data-action="page" data-page="' + (state.ui.page - 1) + '" ' +
                      'class="btn-ghost btn-sm"' + (state.ui.page <= 1 ? ' disabled' : '') + '>' +
                      '<i data-lucide="chevron-left" class="h-4 w-4"></i><span>Prev</span>' +
                    '</button>' +
                    '<span class="text-xs text-muted">Page ' + state.ui.page + ' of ' + totalPages + '</span>' +
                    '<button type="button" data-action="page" data-page="' + (state.ui.page + 1) + '" ' +
                      'class="btn-ghost btn-sm"' + (state.ui.page >= totalPages ? ' disabled' : '') + '>' +
                      '<span>Next</span><i data-lucide="chevron-right" class="h-4 w-4"></i>' +
                    '</button>' +
                  '</div>'
                : '') +
            '</div>';

    container.innerHTML = html;
    refreshIcons();
  }

  /* =========================================================================
     VIEW: EXPIRATIONS  (redesigned)
     ========================================================================= */

  /* Extract every product that has a computable expiry, with its status. */
  function getExpiryItems() {
    return state.products
      .map(function (p) { return { product: p, status: getStatus(p) }; })
      .filter(function (x) { return x.status.days !== null; });
  }

  /* Summary numbers for the hero + filter pill badges. */
  function getExpirySummary(items) {
    const s = { upcoming: 0, today: 0, week: 0, month: 0, quarter: 0, expired: 0 };
    for (let i = 0; i < items.length; i++) {
      const d = items[i].status.days;
      if (d < 0) { s.expired += 1; continue; }
      s.upcoming += 1;
      if (d === 0) s.today += 1;
      if (d <= 7)  s.week += 1;
      if (d <= 30) s.month += 1;
      if (d <= 90) s.quarter += 1;
    }
    return s;
  }

  /* Reduce the full item list to the subset selected by the active tab. */
  function filterExpiryItems(items, range) {
    if (range === 'expired') {
      return items.filter(function (x) { return x.status.days < 0; });
    }
    const upcoming = items.filter(function (x) { return x.status.days >= 0; });
    if (range === 'upcoming') return upcoming;
    const n = Number(range);
    if (!isFinite(n)) return upcoming;
    return upcoming.filter(function (x) { return x.status.days <= n; });
  }

  /* Group a sorted item list into month buckets ({month, year, items}). */
  function groupExpiryByMonth(items) {
    const groups = [];
    const index = {};
    items.forEach(function (item) {
      const d = parseISODate(item.status.expiryISO);
      if (!d) return;
      const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      if (!index[key]) {
        index[key] = { key: key, month: d.getMonth(), year: d.getFullYear(), items: [] };
        groups.push(index[key]);
      }
      index[key].items.push(item);
    });
    return groups;
  }

      '<section class="flex flex-col gap-3">' +

  function expiryRowHTML(item) {

      ? state.products.filter(function (p) { return p.id === productId; })[0]
      : null;

    if (productId && !existing) {
      toast('That product could not be found.', 'error');
      return;
    }

    let receipt = existing && existing.receipt ? Object.assign({}, existing.receipt) : null;

    const p = existing || {
      name: '', brand: '', category: 'Electronics', model: '', serial: '',
      price: null, purchaseDate: toISODate(todayLocal()),
      warrantyDuration: null, warrantyUnit: 'years', customExpiry: null,
      store: '', orderId: '', notes: ''
    };

    const categoryOptions = CATEGORIES.map(function (c) {
      return '<option value="' + esc(c.id) + '"' + (p.category === c.id ? ' selected' : '') + '>' +
               esc(c.id) + '</option>';
    }).join('');

    const unitOptions = ['days', 'months', 'years'].map(function (u) {
      return '<option value="' + u + '"' + (p.warrantyUnit === u ? ' selected' : '') + '>' +
               u.charAt(0).toUpperCase() + u.slice(1) + '</option>';
    }).join('');

    const priceValue = (p.price === null || p.price === undefined) ? '' : String(p.price);
    const durationValue = (p.warrantyDuration === null || p.warrantyDuration === undefined) ? '' : String(p.warrantyDuration);

    const formHTML =
      '<form id="productForm" novalidate class="flex min-h-0 flex-1 flex-col">' +

        '<div class="flex shrink-0 items-start justify-between gap-3 border-b border-white/5 px-5 py-4">' +
          '<div class="min-w-0">' +
            '<h2 class="text-base font-semibold">' + (existing ? 'Edit product' : 'Add product') + '</h2>' +
            '<p class="mt-0.5 text-xs text-muted">Warranty expiry is calculated automatically.</p>' +
          '</div>' +
          '<button type="button" data-close aria-label="Close dialog" ' +
            'class="shrink-0 rounded-lg p-1.5 text-muted transition hover:bg-white/10 hover:text-ink">' +
            '<i data-lucide="x" class="h-4 w-4"></i>' +
          '</button>' +
        '</div>' +

        '<div class="min-h-0 flex-1 overflow-y-auto px-5 py-4">' +
          '<div class="grid gap-4 sm:grid-cols-2">' +

            '<div class="sm:col-span-2">' +
              '<label class="label" for="pf-name">Product name <span class="text-danger">*</span></label>' +
              '<input id="pf-name" name="name" type="text" class="input" required autocomplete="off" ' +
                'placeholder="e.g. Sony WH-1000XM5 Headphones" value="' + esc(p.name) + '" />' +
              '<p class="mt-1 hidden text-xs text-danger" data-error="name"></p>' +
            '</div>' +

            '<div>' +
              '<label class="label" for="pf-brand">Brand</label>' +
              '<input id="pf-brand" name="brand" type="text" class="input" autocomplete="off" ' +
                'placeholder="e.g. Sony" value="' + esc(p.brand) + '" />' +
            '</div>' +

            '<div>' +
              '<label class="label" for="pf-category">Category</label>' +
              '<select id="pf-category" name="category" class="input">' + categoryOptions + '</select>' +
            '</div>' +

            '<div>' +
              '<label class="label" for="pf-model">Model number</label>' +
              '<input id="pf-model" name="model" type="text" class="input" autocomplete="off" ' +
                'placeholder="e.g. WH1000XM5/B" value="' + esc(p.model) + '" />' +
            '</div>' +

            '<div>' +
              '<label class="label" for="pf-serial">Serial number <span class="text-muted">(optional)</span></label>' +
              '<input id="pf-serial" name="serial" type="text" class="input" autocomplete="off" ' +
                'placeholder="e.g. S01-4829103" value="' + esc(p.serial) + '" />' +
            '</div>' +

            '<div>' +
              '<label class="label" for="pf-price">Purchase price (' + esc(state.settings.currency) + ')</label>' +
              '<input id="pf-price" name="price" type="number" min="0" step="0.01" class="input" ' +
                'placeholder="0.00" value="' + esc(priceValue) + '" />' +
              '<p class="mt-1 hidden text-xs text-danger" data-error="price"></p>' +
            '</div>' +

            '<div>' +
              '<label class="label" for="pf-purchaseDate">Purchase date <span class="text-danger">*</span></label>' +
              '<input id="pf-purchaseDate" name="purchaseDate" type="date" class="input" required ' +
                'value="' + esc(p.purchaseDate || '') + '" />' +
              '<p class="mt-1 hidden text-xs text-danger" data-error="purchaseDate"></p>' +
            '</div>' +

            '<div>' +
              '<label class="label" for="pf-warrantyDuration">Warranty duration</label>' +
              '<input id="pf-warrantyDuration" name="warrantyDuration" type="number" min="0" step="1" class="input" ' +
                'placeholder="e.g. 2" value="' + esc(durationValue) + '" />' +
              '<p class="mt-1 hidden text-xs text-danger" data-error="warrantyDuration"></p>' +
            '</div>' +

            '<div>' +
              '<label class="label" for="pf-warrantyUnit">Warranty unit</label>' +
              '<select id="pf-warrantyUnit" name="warrantyUnit" class="input">' + unitOptions + '</select>' +
            '</div>' +

            '<div class="sm:col-span-2">' +
              '<label class="label" for="pf-customExpiry">Custom warranty expiry date <span class="text-muted">(optional — overrides the calculation)</span></label>' +
              '<input id="pf-customExpiry" name="customExpiry" type="date" class="input" ' +
                'value="' + esc(p.customExpiry || '') + '" />' +
              '<p class="mt-1 hidden text-xs text-danger" data-error="customExpiry"></p>' +
              '<p id="pf-expiryPreview" class="mt-2 text-xs text-muted"></p>' +
            '</div>' +

            '<div>' +
              '<label class="label" for="pf-store">Store / seller</label>' +
              '<input id="pf-store" name="store" type="text" class="input" autocomplete="off" ' +
                'placeholder="e.g. Amazon India" value="' + esc(p.store) + '" />' +
            '</div>' +

            '<div>' +
              '<label class="label" for="pf-orderId">Store order ID</label>' +
              '<input id="pf-orderId" name="orderId" type="text" class="input" autocomplete="off" ' +
                'placeholder="e.g. 403-1234567-8901234" value="' + esc(p.orderId) + '" />' +
            '</div>' +

            '<div class="sm:col-span-2">' +
              '<label class="label" for="pf-notes">Notes</label>' +
              '<textarea id="pf-notes" name="notes" rows="3" class="input resize-y" ' +
                'placeholder="Anything worth remembering…">' + esc(p.notes) + '</textarea>' +
            '</div>' +

            '<div class="sm:col-span-2">' +
              '<label class="label" for="pf-receipt">Receipt or invoice attachment</label>' +
              '<div id="receiptCurrent" class="mb-2"></div>' +
              '<input id="pf-receipt" name="receipt" type="file" accept="image/*,application/pdf" ' +
                'class="block w-full cursor-pointer rounded-xl border border-white/10 bg-surface text-sm text-muted file:mr-3 file:cursor-pointer file:rounded-lg file:border-0 file:bg-primary/20 file:px-3 file:py-2 file:text-xs file:font-semibold file:text-primary hover:file:bg-primary/30" />' +
              '<p class="mt-1.5 text-xs text-muted">Images or PDF · max 1.5 MB. Stored locally on this device only.</p>' +
              '<p class="mt-1 hidden text-xs text-danger" data-error="receipt"></p>' +
            '</div>' +

          '</div>' +
        '</div>' +

        '<div class="flex shrink-0 flex-col-reverse gap-2 border-t border-white/5 px-5 py-4 sm:flex-row sm:justify-end">' +
          '<button type="button" class="btn-ghost" data-close>Cancel</button>' +
          '<button type="submit" class="btn-primary">' +
            '<i data-lucide="' + (existing ? 'save' : 'plus') + '" class="h-4 w-4"></i>' +
            '<span>' + (existing ? 'Save changes' : 'Add product') + '</span>' +
          '</button>' +
        '</div>' +

      '</form>';

    showModal(formHTML, { size: 'max-w-2xl' });

    const form = document.getElementById('productForm');
    if (!form) return;

    const receiptCurrent = document.getElementById('receiptCurrent');

    function renderReceiptChip() {
      if (!receiptCurrent) return;
      if (!receipt) {
        receiptCurrent.innerHTML = '';
        return;
      }
      const isImage = /^image\//.test(receipt.type || '');
      receiptCurrent.innerHTML =
        '<div class="flex items-center gap-2 rounded-xl border border-white/10 bg-surface px-3 py-2">' +
          '<i data-lucide="' + (isImage ? 'image' : 'file-text') + '" class="h-4 w-4 shrink-0 text-primary"></i>' +
          '<span class="min-w-0 flex-1 truncate text-xs">' + esc(receipt.name) + ' · ' + esc(formatBytes(receipt.size)) + '</span>' +
          '<button type="button" id="removeReceipt" class="shrink-0 rounded-md p-1 text-muted transition hover:bg-white/10 hover:text-danger" ' +
            'aria-label="Remove attachment"><i data-lucide="x" class="h-3.5 w-3.5"></i></button>' +
        '</div>';
      refreshIcons();
      const removeBtn = document.getElementById('removeReceipt');
      if (removeBtn) {
        removeBtn.addEventListener('click', function () {
          receipt = null;
          const input = document.getElementById('pf-receipt');
          if (input) input.value = '';
          renderReceiptChip();
        });
      }
    }
    renderReceiptChip();

    function updateExpiryPreview() {
      const preview = document.getElementById('pf-expiryPreview');
      if (!preview) return;
      const draft = readFormDraft();
      const expiry = computeExpiryDate({
        purchaseDate: draft.purchaseDate,
        warrantyDuration: draft.warrantyDuration,
        warrantyUnit: draft.warrantyUnit,
        customExpiry: draft.customExpiry
      });
      if (!expiry) {
        preview.textContent = draft.customExpiry
          ? 'Custom expiry date set.'
          : 'No warranty period set — this product will show as “No Warranty”.';
        preview.className = 'mt-2 text-xs text-muted';
        return;
      }
      const days = daysBetween(todayLocal(), expiry);
      let suffix;
      if (days < 0) suffix = 'already expired';
      else if (days === 0) suffix = 'expires today';
      else suffix = pluralDays(days) + ' remaining';
      preview.textContent = 'Calculated expiry: ' + formatDate(expiry) + ' (' + suffix + ')';
      preview.className = 'mt-2 text-xs ' + (days < 0 ? 'text-danger' : days <= 30 ? 'text-warning' : 'text-success');
    }

    function readFormDraft() {
      return {
        name: (form.querySelector('#pf-name') || {}).value || '',
        brand: (form.querySelector('#pf-brand') || {}).value || '',
        category: (form.querySelector('#pf-category') || {}).value || 'Other',
        model: (form.querySelector('#pf-model') || {}).value || '',
        serial: (form.querySelector('#pf-serial') || {}).value || '',
        price: (form.querySelector('#pf-price') || {}).value || '',
        purchaseDate: (form.querySelector('#pf-purchaseDate') || {}).value || '',
        warrantyDuration: (form.querySelector('#pf-warrantyDuration') || {}).value || '',
        warrantyUnit: (form.querySelector('#pf-warrantyUnit') || {}).value || 'years',
        customExpiry: (form.querySelector('#pf-customExpiry') || {}).value || '',
        store: (form.querySelector('#pf-store') || {}).value || '',
        orderId: (form.querySelector('#pf-orderId') || {}).value || '',
        notes: (form.querySelector('#pf-notes') || {}).value || ''
      };
    }

    ['pf-purchaseDate', 'pf-warrantyDuration', 'pf-warrantyUnit', 'pf-customExpiry'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', updateExpiryPreview);
        el.addEventListener('change', updateExpiryPreview);
      }
    });
    updateExpiryPreview();

    const fileInput = document.getElementById('pf-receipt');
    if (fileInput) {
      fileInput.addEventListener('change', function () {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        clearError('receipt');

        if (file.size > MAX_RECEIPT_BYTES) {
          showError('receipt', 'File is too large. Maximum size is 1.5 MB.');
          fileInput.value = '';
          return;
        }

        const reader = new FileReader();
        reader.onload = function () {
          receipt = {
            name: file.name,
            type: file.type || 'application/octet-stream',
            size: file.size,
            dataUrl: String(reader.result)
          };
          renderReceiptChip();
        };
        reader.onerror = function () {
          showError('receipt', 'That file could not be read.');
        };
        reader.readAsDataURL(file);
      });
    }

    function showError(field, message) {
      const errorEl = form.querySelector('[data-error="' + field + '"]');
      if (errorEl) {
        errorEl.textContent = message;
        errorEl.classList.remove('hidden');
      }
      const input = form.querySelector('[name="' + field + '"]');
      if (input) {
        input.classList.add('border-danger/60');
        input.setAttribute('aria-invalid', 'true');
      }
    }

    function clearError(field) {
      const errorEl = form.querySelector('[data-error="' + field + '"]');
      if (errorEl) {
        errorEl.textContent = '';
        errorEl.classList.add('hidden');
      }
      const input = form.querySelector('[name="' + field + '"]');
      if (input) {
        input.classList.remove('border-danger/60');
        input.removeAttribute('aria-invalid');
      }
    }

    function clearAllErrors() {
      ['name', 'purchaseDate', 'price', 'warrantyDuration', 'customExpiry', 'receipt'].forEach(clearError);
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      clearAllErrors();

      const draft = readFormDraft();
      let firstInvalid = null;

      if (!draft.name.trim()) {
        showError('name', 'Product name is required.');
        firstInvalid = firstInvalid || 'name';
      }

      if (!draft.purchaseDate) {
        showError('purchaseDate', 'Purchase date is required.');
        firstInvalid = firstInvalid || 'purchaseDate';
      } else if (!parseISODate(draft.purchaseDate)) {
        showError('purchaseDate', 'Enter a valid purchase date.');
        firstInvalid = firstInvalid || 'purchaseDate';
      }

      if (draft.price !== '') {
        const price = Number(draft.price);
        if (!isFinite(price) || price < 0) {
          showError('price', 'Enter a valid price (0 or more).');
          firstInvalid = firstInvalid || 'price';
        }
      }

      if (draft.warrantyDuration !== '') {
        const duration = Number(draft.warrantyDuration);
        if (!isFinite(duration) || duration < 0) {
          showError('warrantyDuration', 'Enter a valid duration (0 or more).');
          firstInvalid = firstInvalid || 'warrantyDuration';
        }
      }

      if (draft.customExpiry) {
        const custom = parseISODate(draft.customExpiry);
        if (!custom) {
          showError('customExpiry', 'Enter a valid expiry date.');
          firstInvalid = firstInvalid || 'customExpiry';
        } else {
          const purchase = parseISODate(draft.purchaseDate);
          if (purchase && custom < purchase) {
            showError('customExpiry', 'Expiry date cannot be before the purchase date.');
            firstInvalid = firstInvalid || 'customExpiry';
          }
        }
      }

      if (firstInvalid) {
        const el = form.querySelector('[name="' + firstInvalid + '"]');
        if (el) {
          try { el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
        }
        toast('Please fix the highlighted fields.', 'error');
        return;
      }

      const now = new Date().toISOString();
      const record = {
        id: existing ? existing.id : uid('prod'),
        name: draft.name.trim(),
        brand: draft.brand.trim(),
        category: draft.category,
        model: draft.model.trim(),
        serial: draft.serial.trim(),
        price: draft.price === '' ? null : Number(draft.price),
        purchaseDate: draft.purchaseDate,
        warrantyDuration: draft.warrantyDuration === '' ? null : Number(draft.warrantyDuration),
        warrantyUnit: draft.warrantyUnit,
        customExpiry: draft.customExpiry || null,
        store: draft.store.trim(),
        orderId: draft.orderId.trim(),
        notes: draft.notes.trim(),
        receipt: receipt,
        createdAt: existing ? existing.createdAt : now,
        updatedAt: now,
        isSample: existing ? !!existing.isSample : false
      };

      if (existing) {
        const index = state.products.findIndex(function (item) { return item.id === existing.id; });
        if (index >= 0) state.products[index] = record;
      } else {
        state.products.push(record);
      }

      const saved = saveProducts();
      closeModal();

      if (saved) {
        toast(existing ? 'Product updated.' : 'Product added.', 'success');
      }
      renderView();
    });
  }

  /* =========================================================================
     PRODUCT DETAIL MODAL
     ========================================================================= */

  function openProductDetail(productId) {
    const product = state.products.filter(function (p) { return p.id === productId; })[0];
    if (!product) {
      toast('That product could not be found.', 'error');
      return;
    }

    const st = getStatus(product);
    const cat = categoryMeta(product.category);

    const rows = [
      ['Brand', product.brand || '—'],
      ['Category', product.category],
      ['Model number', product.model || '—'],
      ['Serial number', product.serial || '—'],
      ['Purchase price', formatMoney(product.price)],
      ['Purchase date', formatDate(product.purchaseDate)],
      ['Warranty', product.warrantyDuration
        ? product.warrantyDuration + ' ' + product.warrantyUnit
        : (product.customExpiry ? 'Custom expiry' : '—')],
      ['Expiry date', st.expiryISO ? formatDate(st.expiryISO) : '—'],
      ['Store / seller', product.store || '—'],
      ['Order ID', product.orderId || '—'],
      ['Added', formatDate(new Date(product.createdAt))]
    ];

    let daysLabel;
    if (st.days === null) daysLabel = 'No warranty information';
    else if (st.days < 0) daysLabel = 'Expired ' + pluralDays(st.days) + ' ago';
    else if (st.days === 0) daysLabel = 'Expires today';
    else daysLabel = pluralDays(st.days) + ' remaining';

    let receiptHTML = '';
    if (product.receipt) {
      const isImage = /^image\//.test(product.receipt.type || '');
      receiptHTML =
        '<div class="mt-1 rounded-xl border border-white/10 bg-surface p-3">' +
          (isImage
            ? '<img src="' + esc(product.receipt.dataUrl) + '" alt="Receipt for ' + esc(product.name) + '" ' +
                'class="mb-3 max-h-64 w-full rounded-lg object-contain bg-black/30" />'
            : '<div class="mb-3 flex items-center gap-2 text-sm text-muted">' +
                '<i data-lucide="file-text" class="h-4 w-4 text-primary"></i>' +
                '<span class="truncate">' + esc(product.receipt.name) + '</span>' +
              '</div>') +
          '<div class="flex flex-wrap items-center gap-2">' +
            '<a href="' + esc(product.receipt.dataUrl) + '" download="' + esc(product.receipt.name) + '" ' +
              'class="btn-ghost btn-sm">' +
              '<i data-lucide="download" class="h-3.5 w-3.5"></i><span>Download</span></a>' +
            '<a href="' + esc(product.receipt.dataUrl) + '" target="_blank" rel="noopener noreferrer" ' +
              'class="btn-ghost btn-sm">' +
              '<i data-lucide="external-link" class="h-3.5 w-3.5"></i><span>Open</span></a>' +
            '<span class="text-xs text-muted">' + esc(formatBytes(product.receipt.size)) + '</span>' +
          '</div>' +
        '</div>';
    } else {
      receiptHTML = '<p class="text-sm text-muted">No receipt attached.</p>';
    }

    const body =
      '<div class="flex shrink-0 items-start justify-between gap-3 border-b border-white/5 px-5 py-4">' +
        '<div class="flex min-w-0 items-start gap-3">' +
          '<span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-primary/15 text-primary">' +
            '<i data-lucide="' + esc(cat.icon) + '" class="h-5 w-5"></i>' +
          '</span>' +
          '<div class="min-w-0">' +
            '<h2 class="truncate text-base font-semibold">' + esc(product.name) + '</h2>' +
            '<p class="mt-0.5 truncate text-xs text-muted">' + esc(product.brand || product.category) + '</p>' +
          '</div>' +
        '</div>' +
        '<button type="button" data-close aria-label="Close dialog" ' +
          'class="shrink-0 rounded-lg p-1.5 text-muted transition hover:bg-white/10 hover:text-ink">' +
          '<i data-lucide="x" class="h-4 w-4"></i>' +
        '</button>' +
      '</div>' +

      '<div class="min-h-0 flex-1 overflow-y-auto px-5 py-4">' +
        '<div class="flex flex-wrap items-center gap-2">' +
          statusBadgeHTML(st) +
          '<span class="chip bg-white/5 text-muted border border-white/10">' + esc(daysLabel) + '</span>' +
        '</div>' +

        (st.expiry ? progressHTML(st, product) : '') +

        '<dl class="mt-5 grid grid-cols-1 gap-x-4 gap-y-3 sm:grid-cols-2">' +
          rows.map(function (row) {
            return '<div class="min-w-0">' +
                     '<dt class="text-[11px] font-medium uppercase tracking-wide text-muted">' + esc(row[0]) + '</dt>' +
                     '<dd class="mt-0.5 break-words text-sm">' + esc(row[1]) + '</dd>' +
                   '</div>';
          }).join('') +
        '</dl>' +

        (product.notes
          ? '<div class="mt-5">' +
              '<p class="text-[11px] font-medium uppercase tracking-wide text-muted">Notes</p>' +
              '<p class="mt-1 whitespace-pre-wrap break-words rounded-xl border border-white/10 bg-surface px-3 py-2.5 text-sm leading-relaxed">' +
                esc(product.notes) +
              '</p>' +
            '</div>'
          : '') +

        '<div class="mt-5">' +
          '<p class="mb-2 text-[11px] font-medium uppercase tracking-wide text-muted">Receipt / invoice</p>' +
          receiptHTML +

      '<div class="flex shrink-0 flex-col-reverse gap-2 border-t border-white/5 px-5 py-4 sm:flex-row sm:justify-between">' +
        '<button type="button" data-action="delete-product" data-id="' + esc(product.id) + '" class="btn-danger">' +
          '<i data-lucide="trash-2" class="h-4 w-4"></i><span>Delete</span>' +
        '</button>' +
        '<div class="flex flex-col gap-2 sm:flex-row">' +
          '<button type="button" class="btn-ghost" data-close>Close</button>' +
          '<button type="button" data-action="edit-product" data-id="' + esc(product.id) + '" class="btn-primary">' +
            '<i data-lucide="pencil" class="h-4 w-4"></i><span>Edit</span>' +
          '</button>' +
        '</div>' +
      '</div>';

    showModal(body, { size: 'max-w-xl' });
  }

  /* =========================================================================
     DELETE FLOW
     ========================================================================= */

  function deleteProduct(productId) {
    const product = state.products.filter(function (p) { return p.id === productId; })[0];
    if (!product) {
      toast('That product could not be found.', 'error');
      return;
    }

    confirmDialog({
      title: 'Delete “' + product.name + '”?',
      message: 'This permanently removes the product, its warranty details and any attached receipt from this device. This cannot be undone.',
      confirmText: 'Delete product',
      danger: true
    }).then(function (confirmed) {
      if (!confirmed) return;
      const index = state.products.findIndex(function (p) { return p.id === productId; });
      if (index < 0) return;
      state.products.splice(index, 1);
      saveProducts();
      closeModal();
      toast('Product deleted.', 'success');
      renderView();
    });
  }

  /* =========================================================================
     SAMPLE DATA
     ========================================================================= */

  function buildSampleProducts() {
    const today = todayLocal();

    function daysAgo(n) { return toISODate(addDaysClamped(today, -n)); }
    function daysAhead(n) { return toISODate(addDaysClamped(today, n)); }

    function sampleReceipt(label) {
      const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="480" height="620">' +
          '<rect width="100%" height="100%" fill="#ffffff"/>' +
          '<text x="40" y="70" font-family="monospace" font-size="22" font-weight="bold" fill="#111">PROOFPOCKET</text>' +
